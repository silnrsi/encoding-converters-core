# Build encoding converters and run tests

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "./EncConverters 2019.sln"

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      # Keep building other jobs even if another fails, to show what _is_ still working.
      fail-fast: false
      matrix:
        build_configuration: ["Debug", "Release"]
        build_platform: ["Win32", "x64"]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Install ATL/MFC (for windows-2022, this is v143)
    - name: Install Visual Studio ATL/MFC components
      shell: powershell
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        $vsInstallPath = & .\vswhere.exe -latest -products * -property installationPath

        $components = @(
          "--add Microsoft.VisualStudio.Component.VC.ATL",
          "--add Microsoft.VisualStudio.Component.VC.MFC"
        ) -join ' '

        $args = @(
          "modify",
          "--installPath `"$vsInstallPath`"",
          $components,
          "--quiet",
          "--norestart",
          "--nocache"
        )

        Start-Process -FilePath .\vs_installer.exe -ArgumentList $args -Wait -NoNewWindow

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    # Setup NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet dependencies
      run: nuget restore "${{env.SOLUTION_FILE_PATH}}"

    # The installer/*.wixproj projects are now SDK-style (WixToolset.Sdk, PackageReference-based).
    # Classic `nuget restore` doesn't evaluate SDK-style projects at all, so they need an
    # MSBuild-based restore too. Harmless to run alongside the existing packages.config-style
    # restore above for the rest of the solution.
    - name: Restore SDK-style (PackageReference) projects
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /t:Restore
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Build
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /m
        /v:m
        /bl:build-${{matrix.build_platform}}-${{matrix.build_configuration}}.binlog
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Upload build logs
      uses: actions/upload-artifact@v6
      with:
        name: logs-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: build-*.binlog

    # Package.Release.nuspec ships net462/net48/net9.0/net9.0-windows/netstandard2.0 (see its own
    # comments for what each TFM contributes) - upload every one of those TFM output folders so the
    # build_nuget job (a separate machine, only sees what's uploaded here) can pack them all.
    # net9.0-windows needs the same wildcard treatment as net48: the nuspec's
    # runtimes\EcDistFiles\net9.0-windows\win-*\native entries pull every *.dll/*.config/*.tlb/*.exe
    # from this folder, plus *.json for the .deps.json/.runtimeconfig.json a .NET app needs to run -
    # uploading only SilEncConverters40.dll (as before) silently dropped everything else.
    - name: Upload build artifacts
      if: matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: |
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.exe
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.dll
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.tlb
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.config
          output\net462\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\net462\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\SilEncConverters40.dll
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.exe
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.dll
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.tlb
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.config
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.json
          output\net9.0\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\netstandard2.0\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\MergeModules\**\*.*
        retention-days: 1

  build_nuget:
    needs: build-windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Restore artifact layout
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path output | Out-Null

        $folders = Get-ChildItem -Directory -Path . | Where-Object { $_.Name -like 'build-artifacts-*' }

        foreach ($folder in $folders) {
          Copy-Item "$($folder.FullName)\*" -Destination output -Recurse -Force
        }

    - name: List files
      shell: cmd
      run: dir /s

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    - name: Setup NuGet
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        "${{env.SOLUTION_FILE_PATH}}"
        /t:Restore

#    - name: Setup NuGet
#      uses: NuGet/setup-nuget@v2

    # Uses the same Package.proj target a local dev would run (msbuild Package.proj /t:Pack), so CI
    # and local packaging never drift apart.
    - name: Create NuGet package
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        Package.proj
        /t:Pack
        /p:Configuration=Release

    - name: Upload NuGet package
      uses: actions/upload-artifact@v6
      with:
        name: release-nuget-package
        path: ./output/Release/*.nupkg