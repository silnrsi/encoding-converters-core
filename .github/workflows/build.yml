# Build encoding converters and run tests

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "./EncConverters 2019.sln"

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      # Keep building other jobs even if another fails, to show what _is_ still working.
      fail-fast: false
      matrix:
        build_configuration: ["Debug", "Release"]
        build_platform: ["Win32", "x64"]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Install ATL/MFC (for windows-2022, this is v143)
    - name: Install Visual Studio ATL/MFC components
      shell: powershell
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        $vsInstallPath = & .\vswhere.exe -latest -products * -property installationPath

        $components = @(
          "--add Microsoft.VisualStudio.Component.VC.ATL",
          "--add Microsoft.VisualStudio.Component.VC.MFC"
        ) -join ' '

        $args = @(
          "modify",
          "--installPath `"$vsInstallPath`"",
          $components,
          "--quiet",
          "--norestart",
          "--nocache"
        )

        Start-Process -FilePath .\vs_installer.exe -ArgumentList $args -Wait -NoNewWindow

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    # Setup NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet dependencies
      run: nuget restore "${{env.SOLUTION_FILE_PATH}}"

    # The installer/*.wixproj projects are now SDK-style (WixToolset.Sdk, PackageReference-based).
    # Classic `nuget restore` doesn't evaluate SDK-style projects at all, so they need an
    # MSBuild-based restore too. Harmless to run alongside the existing packages.config-style
    # restore above for the rest of the solution.
    - name: Restore SDK-style (PackageReference) projects
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /t:Restore
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Build
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /m
        /v:m
        /bl:build-${{matrix.build_platform}}-${{matrix.build_configuration}}.binlog
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Upload build logs
      uses: actions/upload-artifact@v6
      with:
        name: logs-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: build-*.binlog

    # Every DLL/EXE the NuGet package ships comes from these per-TFM output folders: lib\<tfm>\ gets
    # SilEncConverters40/ECInterfaces from net462/net48/net9.0/net9.0-windows/netstandard2.0, and
    # runtimes\EcDistFiles\ gets everything in net48 and net9.0-windows (see Package.Release.nuspec).
    # Consumers (SILConverters, OneStoryEditor, ...) install these files as-is, and Windows
    # Smart App Control / WDAC refuses to load unsigned ones ("An Application Control policy has
    # blocked this file", 0x800711C7). So sign every one of them that isn't already validly signed.
    # Files that already carry a vendor signature (Microsoft, Google, ...) are left alone rather
    # than having it replaced with ours. net48 also has to be signed before the merge modules are
    # rebuilt below, since they embed copies of those same files.
    - name: Collect unsigned build outputs
      id: unsigned
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      # pwsh, not powershell: Windows PowerShell 5's utf8 Out-File writes a BOM into GITHUB_OUTPUT
      shell: pwsh
      run: |
        $tfms = 'net462','net48','net9.0','net9.0-windows','netstandard2.0'
        $files = foreach ($tfm in $tfms) {
          $dir = "output\$tfm\${{ matrix.build_platform }}\${{ matrix.build_configuration }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.dll','.exe' } |
              Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
              ForEach-Object { $_.FullName }
          } else {
            Write-Host "::warning::$dir does not exist - nothing from it will be signed"
          }
        }
        Write-Host "Unsigned files to sign: $(@($files).Count)"
        $files | ForEach-Object { Write-Host "  $_" }
        "count=$(@($files).Count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "files<<EOF_FILE_LIST" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        $files | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "EOF_FILE_LIST" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Sign build outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' && steps.unsigned.outputs.count != '0' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files: ${{ steps.unsigned.outputs.files }}

    # Clear the merge-module projects' own bind cache/output so the rebuild below can't decide
    # they're already up to date - the safest guarantee is to force it, rather than trust that
    # WiX's own bind-input tracking picks up the now-newer Source= binaries. Only descend into
    # obj\<platform>\<configuration>\ (the wix bind intermediate/tracking output) and bin\ - never
    # obj\ itself, which is also where these SDK-style wixprojs' NuGet restore assets
    # (project.assets.json etc.) live; deleting those would reintroduce NETSDK1047-style restore
    # failures.
    - name: Clear installer project outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $objDirs = Get-ChildItem -Path installer -Directory -Recurse -Filter obj
        foreach ($dir in $objDirs) {
          Get-ChildItem $dir.FullName -Directory | Remove-Item -Recurse -Force
        }
        Get-ChildItem -Path installer -Directory -Recurse -Filter bin |
          Remove-Item -Recurse -Force

    # Rebuild ONLY the merge-module (.wixproj) projects - never the whole solution. Rebuilding the
    # solution re-runs every C# project's copy-to-output step, which sees that the signed DLL in
    # output\ no longer matches obj\ (different size/timestamp) and copies the unsigned obj\ build
    # back over it, silently undoing the signing above (this is how 1.0.4 shipped unsigned). The
    # wixprojs have no ProjectReferences, so they build fine on their own. Which of them build for
    # this solution platform, and with what project platform, is read from the .sln itself (the
    # "{guid}.Release|Win32.Build.0 = Release|x86" lines) so this can't drift from the solution.
    - name: Rebuild installer projects with signed binaries
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $sln = Get-Content "${{ env.SOLUTION_FILE_PATH }}"
        $solutionCfg = "${{ matrix.build_configuration }}|${{ matrix.build_platform }}"
        $projects = $sln | Select-String '^Project\(.*\) = "[^"]+", "([^"]+\.wixproj)", "\{([0-9A-Fa-f-]+)\}"' |
          ForEach-Object { [pscustomobject]@{ Path = $_.Matches[0].Groups[1].Value; Guid = $_.Matches[0].Groups[2].Value } }
        if (-not $projects) { throw "No .wixproj projects found in ${{ env.SOLUTION_FILE_PATH }}" }
        $built = 0
        foreach ($p in $projects) {
          $pattern = '^\s*\{' + [regex]::Escape($p.Guid) + '\}\.' + [regex]::Escape($solutionCfg) + '\.Build\.0 = ([^|]+)\|(\S+)\s*$'
          $m = $sln | Select-String $pattern | Select-Object -First 1
          if (-not $m) { Write-Host "Skipping $($p.Path) (not built for $solutionCfg)"; continue }
          $cfg = $m.Matches[0].Groups[1].Value; $plat = $m.Matches[0].Groups[2].Value
          Write-Host "Building $($p.Path) ($cfg|$plat)"
          & $env:MSBUILD_PATH $p.Path /v:m /p:Configuration=$cfg /p:Platform=$plat
          if ($LASTEXITCODE -ne 0) { throw "Building $($p.Path) failed" }
          $built++
        }
        if ($built -eq 0) { throw "No .wixproj was built for $solutionCfg - check the .sln parsing above" }

    # Fail here, on the machine that did the signing, rather than shipping an unsigned package:
    # every DLL/EXE in the folders the package is made from must now carry a valid signature.
    - name: Verify build outputs are signed
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $tfms = 'net462','net48','net9.0','net9.0-windows','netstandard2.0'
        $bad = foreach ($tfm in $tfms) {
          $dir = "output\$tfm\${{ matrix.build_platform }}\${{ matrix.build_configuration }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.dll','.exe' } | ForEach-Object {
              $status = (Get-AuthenticodeSignature $_.FullName).Status
              if ($status -ne 'Valid') { "{0,-14} {1}" -f $status, $_.FullName }
            }
          }
        }
        if ($bad) {
          $bad | ForEach-Object { Write-Host "::error::$_" }
          throw "$(@($bad).Count) build output file(s) are not validly signed"
        }
        Write-Host "All build outputs are validly signed."

    # Package.Release.nuspec ships net462/net48/net9.0/net9.0-windows/netstandard2.0 (see its own
    # comments for what each TFM contributes) - upload every one of those TFM output folders so the
    # build_nuget job (a separate machine, only sees what's uploaded here) can pack them all.
    # net9.0-windows needs the same wildcard treatment as net48: the nuspec's
    # runtimes\EcDistFiles\net9.0-windows\win-*\native entries pull every *.dll/*.config/*.tlb/*.exe
    # from this folder, plus *.json for the .deps.json/.runtimeconfig.json a .NET app needs to run -
    # uploading only SilEncConverters40.dll (as before) silently dropped everything else.
    - name: Upload build artifacts
      if: matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: |
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.exe
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.dll
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.tlb
          output\net48\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.config
          output\net462\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\net462\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\SilEncConverters40.dll
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.exe
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.dll
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.tlb
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.config
          output\net9.0-windows\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\*.json
          output\net9.0\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\netstandard2.0\${{ matrix.build_platform }}\${{ matrix.build_configuration }}\ECInterfaces.dll
          output\MergeModules\**\*.*
        retention-days: 1

  build_nuget:
    needs: build-windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v8

    - name: Restore artifact layout
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path output | Out-Null

        $folders = Get-ChildItem -Directory -Path . | Where-Object { $_.Name -like 'build-artifacts-*' }

        foreach ($folder in $folders) {
          Copy-Item "$($folder.FullName)\*" -Destination output -Recurse -Force
        }

    - name: List files
      shell: cmd
      run: dir /s

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    - name: Setup NuGet
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        "${{env.SOLUTION_FILE_PATH}}"
        /t:Restore

#    - name: Setup NuGet
#      uses: NuGet/setup-nuget@v4

    # Uses the same Package.proj target a local dev would run (msbuild Package.proj /t:Pack), so CI
    # and local packaging never drift apart.
    - name: Create NuGet package
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        Package.proj
        /t:Pack
        /p:Configuration=Release

    # Last line of defence: open the .nupkg that was just packed and require every DLL/EXE in it to
    # carry a valid Authenticode signature, so an unsigned package can never be uploaded again.
    # (PR builds skip signing - the secret isn't available to them - so they skip this check too.)
    - name: Verify every DLL/EXE in the package is signed
      if: ${{ github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $pkgs = @(Get-ChildItem output\Release\*.nupkg)
        if ($pkgs.Count -eq 0) { throw "No .nupkg found in output\Release" }
        $bad = @()
        $checked = 0
        foreach ($pkg in $pkgs) {
          $dir = Join-Path $env:RUNNER_TEMP ("nupkg-check-" + $pkg.BaseName)
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($pkg.FullName, $dir)
          Get-ChildItem $dir -Recurse -File | Where-Object { $_.Extension -in '.dll','.exe' } | ForEach-Object {
            $checked++
            $status = (Get-AuthenticodeSignature $_.FullName).Status
            if ($status -ne 'Valid') { $bad += "{0,-14} {1}!{2}" -f $status, $pkg.Name, $_.FullName.Substring($dir.Length + 1) }
          }
        }
        if ($checked -eq 0) { throw "No DLL/EXE files found inside the package - the check would be meaningless" }
        if ($bad) {
          $bad | ForEach-Object { Write-Host "::error::$_" }
          throw "$($bad.Count) of $checked DLL/EXE file(s) in the NuGet package are not validly signed"
        }
        Write-Host "All $checked DLL/EXE files in the NuGet package are validly signed."

    - name: Upload NuGet package
      uses: actions/upload-artifact@v6
      with:
        name: release-nuget-package
        path: ./output/Release/*.nupkg